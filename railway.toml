[build]
builder = "nixpacks"

[build.cache]
paths = ["/root/.pnpm-store", "/root/.cache/node-gyp", "node_modules/.cache"]

[deploy]
startCommand = "node scripts/migrate.js && NODE_ENV=production node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
